<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エニクックの事について</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF6B9D">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エニクックの事について">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--main:#FF8FAB;--main-light:#FFD6E0;--main-pale:#FFF0F4;--accent:#FF6B9D;--teal:#4ECDC4;--text:#3D2C2C;--muted:#9E7B7B;--border:#FADADD;--bg:#FFF8FA;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#FF8FAB,#FF6B9D);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 16px rgba(255,107,157,.3)}
.header-left{display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:3px solid rgba(255,255,255,.6);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.header-info h1{font-size:17px;font-weight:700;color:#fff}
.header-info p{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px;display:flex;align-items:center;gap:4px}
.status-dot{width:7px;height:7px;background:#AFFFAE;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.admin-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:500;transition:background .2s}
.admin-btn:hover{background:rgba(255,255,255,.35)}
.tab-bar{display:none;background:var(--white);border-bottom:2px solid var(--main-light);padding:0 20px}
.tab-bar.visible{display:flex}
.tab{padding:12px 20px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#chatScreen{display:flex;flex-direction:column;flex:1}
.chat-wrapper{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;max-width:680px;width:100%;margin:0 auto}
.intro-card{background:var(--white);border:2px solid var(--main-light);border-radius:20px;padding:18px 20px;font-size:13px;line-height:1.9;color:var(--muted);position:relative;overflow:hidden}
.intro-card::before{content:'🍛';position:absolute;right:16px;top:12px;font-size:28px;opacity:.15}
.intro-card strong{color:var(--accent);font-weight:700}
.message{display:flex;gap:10px;align-items:flex-end;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.msg-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.message.bot .msg-avatar{background:linear-gradient(135deg,#FF8FAB,#FF6B9D)}
.message.user .msg-avatar{background:linear-gradient(135deg,#4ECDC4,#2BB5AC)}
.msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bubble{max-width:72%;padding:12px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap}
.message.bot .bubble{background:var(--white);border:2px solid var(--main-light);border-radius:18px 18px 18px 4px;color:var(--text)}
.message.user .bubble{background:linear-gradient(135deg,#4ECDC4,#2BB5AC);color:#fff;border-radius:18px 18px 4px 18px}
.typing{display:flex;gap:10px;align-items:flex-end}
.typing-dots{background:var(--white);border:2px solid var(--main-light);border-radius:18px 18px 18px 4px;padding:14px 18px;display:flex;gap:5px;align-items:center}
.dot{width:7px;height:7px;background:var(--main);border-radius:50%;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.input-area{background:var(--white);border-top:2px solid var(--main-light);padding:12px 16px 16px;position:sticky;bottom:0}
.input-inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--main-pale);border:2px solid var(--main-light);border-radius:24px;padding:8px 8px 8px 16px}
textarea{flex:1;border:none;background:transparent;padding:6px 0;font-family:'Noto Sans JP',sans-serif;font-size:14px;color:var(--text);resize:none;outline:none;max-height:100px;min-height:36px;line-height:1.6}
textarea::placeholder{color:#D4A0B0}
#sendBtn{width:40px;height:40px;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;flex-shrink:0;box-shadow:0 2px 8px rgba(255,107,157,.4)}
#sendBtn:hover{transform:scale(1.08)}#sendBtn:active{transform:scale(.95)}
#sendBtn:disabled{background:#DDD;box-shadow:none;cursor:not-allowed}
#sendBtn svg{width:18px;height:18px;fill:#fff}
.footer-note{text-align:center;font-size:10px;color:#D4A0B0;margin-top:8px;max-width:680px;margin-left:auto;margin-right:auto}
#adminScreen{display:none;flex:1;flex-direction:column}
#adminScreen.visible{display:flex}
.admin-panel{max-width:680px;width:100%;margin:0 auto;padding:20px 16px;flex:1}
.admin-panel h2{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:16px}
.client-form{background:var(--white);border:2px solid var(--main-light);border-radius:16px;padding:18px;margin-bottom:20px}
.client-form h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--text);background:var(--main-pale);outline:none;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--main);background:#fff}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
.save-btn{width:100%;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);border:none;border-radius:12px;padding:12px;color:#fff;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:opacity .2s}
.save-btn:hover{opacity:.85}
.csv-bar{display:flex;gap:10px;margin-bottom:16px}
.csv-btn{flex:1;border-radius:10px;padding:10px;font-size:13px;font-weight:600;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border:2px solid;transition:opacity .2s;text-align:center}
.csv-btn:hover{opacity:.8}
.csv-export{background:#C8F4F2;color:#2BB5AC;border-color:#4ECDC4}
.csv-import{background:var(--main-pale);color:var(--accent);border-color:var(--main-light);display:flex;align-items:center;justify-content:center}
#csvFileInput{display:none}
.client-list{display:flex;flex-direction:column;gap:12px}
.client-card{background:var(--white);border:2px solid var(--main-light);border-radius:14px;padding:14px 16px}
.client-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.client-name{font-size:14px;font-weight:700;color:var(--text)}
.client-actions{display:flex;gap:8px}
.edit-btn,.del-btn{border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:500}
.edit-btn{background:var(--main-pale);color:var(--accent);border:1.5px solid var(--main-light)}
.del-btn{background:#FFF0F0;color:#E05555;border:1.5px solid #FFCECE}
.client-memo{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.client-label{font-size:11px;font-weight:500;color:var(--main);margin-bottom:2px}
.empty-msg{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
.pin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.pin-overlay.visible{display:flex}
.pin-dialog{background:#fff;border-radius:20px;padding:28px 24px;width:300px;text-align:center}
.pin-dialog h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px}
.pin-dialog p{font-size:12px;color:var(--muted);margin-bottom:16px}
.pin-input{width:100%;border:2px solid var(--main-light);border-radius:10px;padding:10px;font-size:18px;text-align:center;letter-spacing:6px;outline:none;font-family:monospace}
.pin-input:focus{border-color:var(--main)}
.pin-btn{margin-top:12px;width:100%;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);border:none;border-radius:10px;padding:10px;color:#fff;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.pin-error{color:#E05555;font-size:12px;margin-top:8px}
.feedback-bar{display:flex;gap:8px;margin-top:8px;margin-left:48px}
.fb-btn{border:none;border-radius:20px;padding:5px 12px;font-size:11px;font-family:"Noto Sans JP",sans-serif;cursor:pointer;font-weight:500;transition:all .2s}
.fb-good{background:#E8F5E9;color:#2E7D32;border:1.5px solid #A5D6A7}
.fb-good:hover{background:#C8E6C9}
.fb-bad{background:#FFF0F4;color:var(--accent);border:1.5px solid var(--main-light)}
.fb-bad:hover{background:var(--main-light)}
.feedback-form{margin-top:8px;margin-left:48px;background:var(--white);border:2px solid var(--main-light);border-radius:14px;padding:12px}
.feedback-form p{font-size:12px;color:var(--muted);margin-bottom:8px}
.feedback-form textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-family:"Noto Sans JP",sans-serif;font-size:13px;color:var(--text);background:var(--main-pale);outline:none;resize:vertical;min-height:60px}
.feedback-form textarea:focus{border-color:var(--main);background:#fff}
.fb-save{margin-top:8px;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);border:none;border-radius:8px;padding:7px 16px;color:#fff;font-size:12px;font-weight:700;font-family:"Noto Sans JP",sans-serif;cursor:pointer}
.chat-wrapper::-webkit-scrollbar{width:4px}
.chat-wrapper::-webkit-scrollbar-thumb{background:var(--main-light);border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="avatar"><img src="icon.png" alt="icon"></div>
    <div class="header-info">
      <h1>エニクックの事について</h1>
      <p><span class="status-dot"></span>合同会社エニクック｜社内AIアシスタント</p>
    </div>
  </div>
  <button class="admin-btn" id="adminBtnEl">⚙ 管理</button>
</header>

<div class="tab-bar" id="tabBar">
  <div class="tab active" id="tabChatEl">💬 チャット</div>
  <div class="tab" id="tabAdminEl">🏢 取引先管理</div>
</div>

<div id="chatScreen">
  <div class="chat-wrapper" id="chatArea">
    <div class="intro-card">
      エニクックのことについて、気軽に質問してみてください 😊
    </div>
  </div>
  <div class="input-area">
    <div class="input-inner">
      <textarea id="inputBox" placeholder="なんでも聞いてみてください…" rows="1"></textarea>
      <button id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="footer-note">※重要な判断は直接ご確認ください。</p>
  </div>
</div>

<div id="adminScreen">
  <div class="admin-panel">
    <h2>🏢 取引先管理</h2>
    <div class="client-form">
      <h3 id="formTitle">➕ 取引先を追加</h3>
      <input type="hidden" id="editId">
      <div class="form-group"><label>取引先名</label><input type="text" id="clientName" placeholder="例：キヨトク"></div>
      <div class="form-group"><label>正式名称</label><input type="text" id="clientFormal" placeholder="例：株式会社キヨトク"></div>
      <div class="form-group"><label>発送先名</label><input type="text" id="clientShipName" placeholder="例：株式会社キヨトク 倉庫担当"></div>
      <div class="form-group"><label>郵便番号</label><input type="text" id="clientZip" placeholder="例：812-0882"></div>
      <div class="form-group"><label>住所</label><input type="text" id="clientAddress" placeholder="例：福岡県福岡市博多区麦野４丁目２５番２４号"></div>
      <div class="form-group"><label>担当者</label><input type="text" id="clientContact" placeholder="例：田中様"></div>
      <div class="form-group"><label>電話番号</label><input type="text" id="clientPhone" placeholder="例：092-586-9633"></div>
      <div class="form-group"><label>商品</label><input type="text" id="clientProduct" placeholder="例：ダメヤカレー・チャーシュー"></div>
      <div class="form-group"><label>発送方法・注意事項</label><textarea id="clientMemo" placeholder="例：返信FAXで引取り日連絡。代引き手数料440円忘れずに。"></textarea></div>
      <button class="save-btn" id="saveClientBtn">💾 保存する</button>
    </div>
    <div class="csv-bar">
      <button class="csv-btn csv-export" id="exportCsvBtn">📥 CSVエクスポート</button>
      <label class="csv-btn csv-import">📤 CSVインポート<input type="file" id="csvFileInput" accept=".csv"></label>
    </div>
    <div class="client-list" id="clientList"><p class="empty-msg">取引先を追加してください</p></div>
  </div>
</div>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-dialog">
    <h3>🔐 管理画面</h3>
    <p>PINコードを入力してください</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="••••">
    <div class="pin-error" id="pinError"></div>
    <button class="pin-btn" id="pinBtnEl">入力</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
var ADMIN_PIN = "1234";
var clientsData = [];
var messages = [];

// 製造日報取得
function getTodayStr() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth()+1).padStart(2,'0');
  var d = String(now.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + d;
}

function fetchNippoData(targetDate, fromDate, toDate) {
  if (!nippoDB) return Promise.resolve([]);
  return nippoDB.collection("nippo").get().then(function(snapshot) {
    var reports = [];
    snapshot.forEach(function(d) {
      var data = d.data();
      if (!data.date) return;
      if (targetDate && data.date === targetDate) { reports.push(data); return; }
      if (fromDate && toDate && data.date >= fromDate && data.date <= toDate) { reports.push(data); return; }
      if (!targetDate && !fromDate) reports.push(data);
    });
    reports.sort(function(a,b) { return b.date.localeCompare(a.date); });
    return reports.slice(0, 20); // 最大20件
  }).catch(function() { return []; });
}

// テキストから日付を解析する関数
function parseDateFromText(text) {
  var today = new Date();
  var todayStr = getTodayStr();

  // 今日・本日
  if (text.match(/今日|本日/)) return {type:'single', date: todayStr};

  // 昨日
  if (text.match(/昨日/)) {
    var d = new Date(today); d.setDate(d.getDate()-1);
    return {type:'single', date: d.toISOString().slice(0,10)};
  }

  // 今週
  if (text.match(/今週/)) {
    var mon = new Date(today);
    mon.setDate(today.getDate() - today.getDay() + (today.getDay()===0 ? -6 : 1));
    return {type:'range', from: mon.toISOString().slice(0,10), to: todayStr};
  }

  // 先週
  if (text.match(/先週/)) {
    var lastMon = new Date(today);
    lastMon.setDate(today.getDate() - today.getDay() - 6);
    var lastSun = new Date(lastMon); lastSun.setDate(lastMon.getDate()+6);
    return {type:'range', from: lastMon.toISOString().slice(0,10), to: lastSun.toISOString().slice(0,10)};
  }

  // 今月
  if (text.match(/今月/)) {
    var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    return {type:'range', from: firstDay.toISOString().slice(0,10), to: todayStr};
  }

  // 先月
  if (text.match(/先月/)) {
    var firstDayLast = new Date(today.getFullYear(), today.getMonth()-1, 1);
    var lastDayLast = new Date(today.getFullYear(), today.getMonth(), 0);
    return {type:'range', from: firstDayLast.toISOString().slice(0,10), to: lastDayLast.toISOString().slice(0,10)};
  }

  // X月Y日
  var mdMatch = text.match(/(\d{1,2})月(\d{1,2})日/);
  if (mdMatch) {
    var year = today.getFullYear();
    var month = String(mdMatch[1]).padStart(2,'0');
    var day = String(mdMatch[2]).padStart(2,'0');
    return {type:'single', date: year + '-' + month + '-' + day};
  }

  // YYYY-MM-DD
  var fullMatch = text.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (fullMatch) return {type:'single', date: fullMatch[0]};

  // 過去・最近・これまで → 直近30件
  if (text.match(/過去|最近|これまで|全部|一覧/)) {
    return {type:'all'};
  }

  return null;
}

function formatNippoForAI(reports) {
  if (reports.length === 0) return '本日の製造日報データはありません。';
  var text = '';
  reports.forEach(function(r) {
    text += '【製造日：' + r.date + '　担当：' + (r.author || '不明') + '】\n';
    if (r.semiProduct) text += '半製品：' + r.semiProduct + '\n';
    ['batch1','batch2','batch3'].forEach(function(b, i) {
      var batch = r[b];
      if (batch && batch.name) {
        text += 'バッチ' + (i+1) + '：' + batch.name + '　数量：' + (batch.qty || '-') + '袋　時間：' + (batch.start || '-') + '〜' + (batch.end || '-') + '\n';
        if (batch.notes) text += '　メモ：' + batch.notes + '\n';
      }
    });
    if (r.otherNotes) text += '備考：' + r.otherNotes + '\n';
    text += '\n';
  });
  return text;
}

// personsマスターを取得してIDと名前のマップを作る
function fetchPersonsMap() {
  if (!scheduleDB) return Promise.resolve({});
  return scheduleDB.ref('persons').once('value').then(function(snapshot) {
    var map = {};
    snapshot.forEach(function(child) {
      var p = child.val();
      if (p.id && p.name) map[p.id] = p.name;
    });
    return map;
  }).catch(function() { return {}; });
}

function fetchScheduleData(targetDate, fromDate, toDate, personName) {
  if (!scheduleDB) return Promise.resolve([]);
  return Promise.all([
    scheduleDB.ref('schedules').once('value'),
    fetchPersonsMap()
  ]).then(function(results) {
    var snapshot = results[0];
    var personsMap = results[1];
    var schedules = [];
    snapshot.forEach(function(child) {
      var s = child.val();
      // 担当者名を付与
      s.personName = s.personId ? (personsMap[s.personId] || s.personId) : '';
      var startDate = s.start ? s.start.slice(0,10) : '';
      var checkDate = s.mfgDate || s.shipDate || startDate;
      if (!checkDate) return;

      // 担当者フィルター
      if (personName && s.personName !== personName) return;

      if (targetDate) {
        if (s.mfgDate === targetDate || s.shipDate === targetDate || startDate === targetDate) { schedules.push(s); }
        return;
      }
      if (fromDate && toDate) {
        if ((s.mfgDate && s.mfgDate >= fromDate && s.mfgDate <= toDate) ||
            (s.shipDate && s.shipDate >= fromDate && s.shipDate <= toDate) ||
            (startDate && startDate >= fromDate && startDate <= toDate)) {
          schedules.push(s);
        }
        return;
      }
      schedules.push(s);
    });
    schedules.sort(function(a,b) {
      var da = a.mfgDate || a.shipDate || (a.start||'').slice(0,10) || '';
      var db2 = b.mfgDate || b.shipDate || (b.start||'').slice(0,10) || '';
      return da.localeCompare(db2);
    });
    return schedules.slice(0, 30);
  }).catch(function() { return []; });
}

function formatScheduleForAI(schedules, searchType) {
  if (schedules.length === 0) return '該当期間のスケジュールデータはありません。';
  var text = '';
  schedules.forEach(function(s) {
    var typeLabel = s.type === 'personal' ? '【個人予定】' : '【工場予定】';
    text += typeLabel + (s.title || '未定') + '\n';
    if (s.personName) text += '  担当者：' + s.personName + '\n';
    if (s.start) text += '  日時：' + s.start.slice(0,10) + ' ' + s.start.slice(11,16) + '〜' + (s.end ? s.end.slice(11,16) : '') + '\n';
    if (s.mfgDate) text += '  製造日：' + s.mfgDate + '\n';
    if (s.shipDate) text += '  出荷日：' + s.shipDate + '\n';
    if (s.note) text += '  備考：' + s.note + '\n';
    text += '\n';
  });
  return text;
}

function fetchScheduleByShipDate(targetDate, fromDate, toDate) {

var learnedQA = [];
function loadLearnedQA() {
  db.collection("learnedQA").get().then(function(snapshot) {
    learnedQA = [];
    snapshot.forEach(function(d) { learnedQA.push(Object.assign({id: d.id}, d.data())); });
  }).catch(function(e) { console.warn("learnedQA load error:", e); });
}

// 質問と学習済みQ&Aを照合する
function findLearnedAnswer(question) {
  if (learnedQA.length === 0) return null;
  var best = null;
  var bestScore = 0;
  learnedQA.forEach(function(qa) {
    // 簡易一致スコア（共通文字数）
    var score = 0;
    var qChars = question.split('');
    qChars.forEach(function(c) { if (qa.question && qa.question.includes(c)) score++; });
    var similarity = score / Math.max(question.length, (qa.question||'').length);
    if (similarity > 0.6 && similarity > bestScore) {
      bestScore = similarity;
      best = qa;
    }
  });
  return best;
}

  });
  var csv = [header].concat(rows).map(function(r) { return r.join(','); }).join('\n');
  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '取引先リスト.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importCSV(event) {
  var file = event.target.files[0];
  if (!file) return;
  file.text().then(function(text) {
    var lines = text.split('\n').filter(function(l) { return l.trim(); });
    if (lines.length < 2) { alert('データが見つかりませんでした'); return; }
    var count = 0;
    var promises = lines.slice(1).map(function(line) {
      var cols = [], cur = '', inQuote = false;
      for (var i = 0; i < line.length; i++) {
        if (line[i] === '"') { if (inQuote && line[i+1] === '"') { cur += '"'; i++; } else { inQuote = !inQuote; } }
        else if (line[i] === ',' && !inQuote) { cols.push(cur); cur = ''; }
        else { cur += line[i]; }
      }
      cols.push(cur);
      var name = (cols[0]||'').trim();
      if (!name) return Promise.resolve();
      count++;
      return db.collection("clients").add({name:name, contact:(cols[1]||'').trim(), phone:(cols[2]||'').trim(), memo:(cols[3]||'').trim(), createdAt:new Date()});
    });
    Promise.all(promises).then(function() {
      alert(count + '件のデータをインポートしました');
      event.target.value = '';
      loadClients();
    });
  });
}

// PIN管理
function openAdmin() {
  if (document.getElementById('tabBar').classList.contains('visible')) {
    document.getElementById('tabBar').classList.remove('visible');
    switchTab('chat');
  } else {
    document.getElementById('pinOverlay').classList.add('visible');
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    setTimeout(function() { document.getElementById('pinInput').focus(); }, 100);
  }
}

function checkPin() {
  if (document.getElementById('pinInput').value === ADMIN_PIN) {
    document.getElementById('pinOverlay').classList.remove('visible');
    document.getElementById('tabBar').classList.add('visible');
    switchTab('admin');
    loadClients();
  } else {
    document.getElementById('pinError').textContent = 'PINコードが違います';
  }
}

function switchTab(tab) {
  document.getElementById('tabChatEl').classList.toggle('active', tab === 'chat');
  document.getElementById('tabAdminEl').classList.toggle('active', tab === 'admin');
  document.getElementById('chatScreen').style.display = tab === 'chat' ? 'flex' : 'none';
  var adminEl = document.getElementById('adminScreen');
  if (tab === 'admin') { adminEl.style.display = 'flex'; adminEl.classList.add('visible'); }
  else { adminEl.style.display = 'none'; adminEl.classList.remove('visible'); }
}

// チャット
function addMessage(role, text, question) {
  var div = document.createElement('div');
  div.className = 'message ' + role;
  var av = document.createElement('div');
  av.className = 'msg-avatar';
  if (role === 'bot') {
    var img = document.createElement('img');
    img.src = 'icon.png';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    av.appendChild(img);
  } else { av.textContent = '👤'; }
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(av); div.appendChild(bubble);
  document.getElementById('chatArea').appendChild(div);

  // ボットの回答にフィードバックボタンを追加
  if (role === 'bot' && question) {
    var fbBar = document.createElement('div');
    fbBar.className = 'feedback-bar';
    fbBar.innerHTML = '<button class="fb-btn fb-good">👍 正しい</button><button class="fb-btn fb-bad">👎 修正が必要</button>';
    document.getElementById('chatArea').appendChild(fbBar);

    var feedbackForm = document.createElement('div');
    feedbackForm.className = 'feedback-form';
    feedbackForm.style.display = 'none';
    feedbackForm.innerHTML = '<p>正しい回答を入力してください：</p><textarea placeholder="正しい回答を入力…"></textarea><br><button class="fb-save">💾 保存して学習させる</button>';
    document.getElementById('chatArea').appendChild(feedbackForm);

    fbBar.children[0].addEventListener('click', function() {
      fbBar.innerHTML = '<span style="font-size:12px;color:#2E7D32">✅ ありがとうございます！</span>';
      feedbackForm.style.display = 'none';
    });

    fbBar.children[1].addEventListener('click', function() {
      feedbackForm.style.display = feedbackForm.style.display === 'none' ? 'block' : 'none';
    });

    feedbackForm.querySelector('.fb-save').addEventListener('click', function() {
      var correctAnswer = feedbackForm.querySelector('textarea').value.trim();
      if (!correctAnswer) { alert('回答を入力してください'); return; }
      db.collection("learnedQA").add({
        question: question,
        answer: correctAnswer,
        originalAnswer: text,
        createdAt: new Date()
      }).then(function() {
        feedbackForm.innerHTML = '<p style="color:#2E7D32">✅ 学習しました！次回から改善された回答をします。</p>';
        learnedQA.push({question: question, answer: correctAnswer});
        fbBar.innerHTML = '<span style="font-size:12px;color:#2E7D32">✅ 学習完了！</span>';
      }).catch(function(e) { alert('保存に失敗しました: ' + e.message); });
    });
  }

  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function showTyping() {
  var div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  var av = document.createElement('div');
  av.className = 'msg-avatar';
  av.style.cssText = 'background:linear-gradient(135deg,#FF8FAB,#FF6B9D);overflow:hidden';
  var img = document.createElement('img');
  img.src = 'icon.png';
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
  av.appendChild(img);
  var dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(av); div.appendChild(dots);
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function removeTyping() {
  var el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function sendMessage() {
  var inputBox = document.getElementById('inputBox');
  var sendBtn = document.getElementById('sendBtn');
  var text = inputBox.value.trim();
  if (!text || isLoading) return;
  inputBox.value = ''; inputBox.style.height = 'auto';
  isLoading = true; sendBtn.disabled = true;
  addMessage('user', text);
  messages.push({role:'user', content:text});
  showTyping();

  var API_KEY = localStorage.getItem('gemini_api_key') || '';
  if (!API_KEY) {
    removeTyping();
    var key = prompt('Gemini APIキーを入力してください（一度入力すると保存されます）：');
    if (!key) { isLoading = false; sendBtn.disabled = false; return; }
    localStorage.setItem('gemini_api_key', key.trim());
    API_KEY = key.trim();
    showTyping();
  }

  var nippoKeywords = ['製造','日報','今日','本日','昨日','今週','先週','今月','先月','バッチ','作業','担当','数量','何袋','何を作','とりめし','カレー','生産','過去','最近','これまで','一覧','記録'];
  var isNippoQuery = nippoKeywords.some(function(k) { return text.includes(k); });
  var dateInfo = isNippoQuery ? parseDateFromText(text) : null;

  var nippoPromise;
  if (!isNippoQuery) {
    nippoPromise = Promise.resolve([]);
  } else if (dateInfo && dateInfo.type === 'single') {
    nippoPromise = fetchNippoData(dateInfo.date, null, null);
  } else if (dateInfo && dateInfo.type === 'range') {
    nippoPromise = fetchNippoData(null, dateInfo.from, dateInfo.to);
  } else {
    nippoPromise = fetchNippoData(null, null, null);
  }

  var scheduleKeywords = ['スケジュール','予定','出荷','納期','いつ','計画','今週','来週','今月','来月','月','日','出荷日','製造日','発送'];
  var isScheduleQuery = scheduleKeywords.some(function(k) { return text.includes(k); });
  var scheduleDateInfo = isScheduleQuery ? parseDateFromText(text) : null;

  var isShipQuery = text.includes('出荷') || text.includes('発送') || text.includes('納期');

  // 担当者名を検出
  var personName = null;
  if (isScheduleQuery) {
    var allPersonNames = clientsData.map(function(c) { return c.name; });
    // スタッフ名を直接テキストから検索（既知の名前）
    var knownStaff = ['養父', '日高', '福士', '山田福士'];
    knownStaff.forEach(function(name) {
      if (text.includes(name)) personName = name;
    });
  }
  var schedulePromise;
  if (!isScheduleQuery) {
    schedulePromise = Promise.resolve([]);
  } else if (isShipQuery && scheduleDateInfo && scheduleDateInfo.type === 'single') {
    schedulePromise = fetchScheduleByShipDate(scheduleDateInfo.date, null, null);
  } else if (isShipQuery && scheduleDateInfo && scheduleDateInfo.type === 'range') {
    schedulePromise = fetchScheduleByShipDate(null, scheduleDateInfo.from, scheduleDateInfo.to);
  } else if (isShipQuery) {
    // 出荷クエリでデフォルトは今日から2ヶ月先
    var from = getTodayStr();
    var to = new Date(); to.setMonth(to.getMonth()+2);
    schedulePromise = fetchScheduleByShipDate(null, from, to.toISOString().slice(0,10));
  } else if (scheduleDateInfo && scheduleDateInfo.type === 'single') {
    schedulePromise = fetchScheduleData(scheduleDateInfo.date, null, null, personName);
  } else if (scheduleDateInfo && scheduleDateInfo.type === 'range') {
    schedulePromise = fetchScheduleData(null, scheduleDateInfo.from, scheduleDateInfo.to, personName);
  } else {
    var from = getTodayStr();
    var to = new Date(); to.setMonth(to.getMonth()+1);
    schedulePromise = fetchScheduleData(null, from, to.toISOString().slice(0,10), personName);
  }

  Promise.all([nippoPromise, schedulePromise]).then(function(results) {
    var nippoReports = results[0];
    var scheduleData = results[1];
    var systemPrompt = SYSTEM_PROMPT_BASE;
    // 学習済みQ&Aを照合して追加
    var learned = findLearnedAnswer(text);
    if (learned) {
      systemPrompt += '\n\n【重要：以前修正された回答】\nQ: ' + learned.question + '\nA: ' + learned.answer + '\n上記の質問に近い場合は必ずこの回答を参考にしてください。';
    }
    if (clientsData.length > 0) {
      systemPrompt += '\n\n【取引先情報】\n';
      clientsData.forEach(function(c) {
        systemPrompt += '\n■ ' + c.name + (c.formal ? '（' + c.formal + '）' : '') + '\n';
        if (c.shipName) systemPrompt += '  発送先：' + c.shipName + '\n';
        if (c.zip || c.address) systemPrompt += '  住所：〒' + (c.zip||'') + ' ' + (c.address||'') + '\n';
        if (c.contact) systemPrompt += '  担当者：' + c.contact + '\n';
        if (c.phone) systemPrompt += '  電話番号：' + c.phone + '\n';
        if (c.product) systemPrompt += '  商品：' + c.product + '\n';
        if (c.memo) systemPrompt += '  発送方法・注意事項：' + c.memo + '\n';
      });
    }
    if (isNippoQuery && nippoReports.length > 0) {
      var dateLabel = dateInfo ? (dateInfo.type === 'single' ? dateInfo.date : dateInfo.type === 'range' ? dateInfo.from + '〜' + dateInfo.to : '直近') : '直近';
      systemPrompt += '\n\n【製造日報（' + dateLabel + '）】\n' + formatNippoForAI(nippoReports);
    } else if (isNippoQuery && nippoReports.length === 0) {
      systemPrompt += '\n\n【製造日報】該当期間の製造日報データはありませんでした。';
    }
    if (isScheduleQuery && scheduleData.length > 0) {
      var schedLabel = scheduleDateInfo ? (scheduleDateInfo.type === 'single' ? scheduleDateInfo.date : scheduleDateInfo.type === 'range' ? scheduleDateInfo.from + '〜' + scheduleDateInfo.to : '今後の予定') : '今後の予定';
      systemPrompt += '\n\n【スケジュール（' + schedLabel + '）】\n' + formatScheduleForAI(scheduleData);
    } else if (isScheduleQuery && scheduleData.length === 0) {
      systemPrompt += '\n\n【スケジュール】該当期間のスケジュールデータはありませんでした。';
    }

    var geminiContents = messages.map(function(m) {
      return {role: m.role === 'assistant' ? 'model' : 'user', parts: [{text: m.content}]};
    });

    return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=' + API_KEY, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({system_instruction: {parts: [{text: systemPrompt}]}, contents: geminiContents})
    });
  }).then(function(response) {
    return response.json();
  }).then(function(data) {
    removeTyping();
    if (data.error) { addMessage('bot', 'エラー：' + data.error.message); }
    else {
      var reply = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || 'うまく回答できませんでした。もう一度試してみてください。';
      addMessage('bot', reply, text);
      messages.push({role:'assistant', content:reply});
    }
    isLoading = false; document.getElementById('sendBtn').disabled = false; document.getElementById('inputBox').focus();
  }).catch(function(err) {
    removeTyping();
    addMessage('bot', '接続エラーが発生しました。しばらくしてからもう一度お試しください。');
    console.error(err);
    isLoading = false; document.getElementById('sendBtn').disabled = false; document.getElementById('inputBox').focus();
  });
}

});

  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

loadClients();
