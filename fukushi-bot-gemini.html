<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福士さんに聞く｜エニクック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #faf7f2;
    --warm: #c8832a;
    --warm-light: #f0dbb8;
    --warm-pale: #fdf5e8;
    --muted: #7a6a55;
    --border: #e0d0b8;
    --chat-bg: #fff9f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ヘッダー */
  header {
    background: var(--ink);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    border: 2px solid var(--warm-light);
  }

  .header-info h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.05em;
  }

  .header-info p {
    font-size: 11px;
    color: var(--warm-light);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #4caf6e;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* チャットエリア */
  .chat-wrapper {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  /* 案内メッセージ */
  .intro-card {
    background: var(--warm-pale);
    border: 1px solid var(--border);
    border-left: 4px solid var(--warm);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
  }

  .intro-card strong {
    color: var(--warm);
    font-weight: 500;
  }

  .topic-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .tag {
    background: var(--warm);
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: opacity 0.2s;
    font-weight: 500;
  }

  .tag:hover { opacity: 0.8; }

  /* メッセージ */
  .message {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Serif JP', serif;
  }

  .message.bot .msg-avatar {
    background: var(--warm);
    color: #fff;
    border: 1.5px solid var(--warm-light);
  }

  .message.user .msg-avatar {
    background: var(--ink);
    color: #fff;
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.75;
  }

  .message.bot .bubble {
    background: #fff;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .message.user .bubble {
    background: var(--ink);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* タイピングインジケーター */
  .typing {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .typing-dots {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--warm);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* 入力エリア */
  .input-area {
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    bottom: 0;
  }

  .input-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--warm-pale);
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 44px;
    transition: border-color 0.2s;
    line-height: 1.6;
  }

  textarea:focus {
    border-color: var(--warm);
    background: #fff;
  }

  textarea::placeholder { color: #bba88a; }

  button#sendBtn {
    width: 44px;
    height: 44px;
    background: var(--warm);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  button#sendBtn:hover { background: #b5721f; }
  button#sendBtn:active { transform: scale(0.95); }
  button#sendBtn:disabled { background: var(--border); cursor: not-allowed; }

  button#sendBtn svg { width: 18px; height: 18px; fill: #fff; }

  /* フッター注記 */
  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #bba88a;
    margin-top: 6px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  /* スクロールバー */
  .chat-wrapper::-webkit-scrollbar { width: 4px; }
  .chat-wrapper::-webkit-scrollbar-track { background: transparent; }
  .chat-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="avatar">福</div>
  <div class="header-info">
    <h1>福士さんに聞く</h1>
    <p><span class="status-dot"></span>合同会社エニクック｜社内AIアシスタント</p>
  </div>
</header>

<div class="chat-wrapper" id="chatArea">
  <div class="intro-card">
    エニクックの経営判断・製造・営業について、<strong>福士さんの考え方</strong>をもとに回答します。<br>
    気軽に質問してみてください。
    <div class="topic-tags">
      <span class="tag" onclick="sendQuick('品質トラブルが起きたらどうすればいい？')">品質トラブル</span>
      <span class="tag" onclick="sendQuick('価格はどうやって決めるの？')">価格設定</span>
      <span class="tag" onclick="sendQuick('スタッフへの指示はどうすればいい？')">製造指示</span>
      <span class="tag" onclick="sendQuick('取引先から値下げを求められたらどうする？')">値下げ交渉</span>
      <span class="tag" onclick="sendQuick('筑紫ちゃんカレーをどこで売ればいい？')">販売戦略</span>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-inner">
    <textarea id="inputBox" placeholder="質問を入力してください…" rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <p class="footer-note">※このボットは福士さんの判断基準をもとにAIが回答します。重要な判断は直接確認してください。</p>
</div>

<script>
const SYSTEM_PROMPT = `あなたは合同会社エニクックの代表・福士さんの分身AIアシスタントです。
社内スタッフからの質問に対して、以下の福士さんの価値観・判断基準をもとに、福士さんらしい口調で回答してください。

【基本的な人柄と話し方】
- 誠実で現場感覚がある
- 難しい言葉を使わず、わかりやすく話す
- 「自分だったら」という視点を大切にする
- 叱るより一緒に考えるスタイル
- 謙虚で、「できている」とは思わない姿勢

【品質管理の判断基準】
- 品質トラブルが起きたら：①自分に非があればまず謝る ②該当商品の出荷を即停止・回収 ③みんなで再発防止策を考える ④実行に移す
- 機械の温度は「完璧」と思ってはいけない
- 連続して同じ不良が出たら、レシピより先に機械・設備を疑う
- 商品の誠実さは絶対に譲れない：確かな材料を使う、人の体に良い商品を作る、手を抜かない、お客様に胸を張って伝えられる商品であること

【コスト感覚】
- コストの優先順位：材料費（最重要）→ 人件費 → 光熱費
- 送料が含まれているかどうかは特に注意して確認する

【製造指示のスタイル】
- まず口頭で説明する
- それでもわからなければ実際にやって見せる
- 繰り返し問題が出るようであれば手順書を作成する（最初から作らない）

【価格設定】
- コスト積み上げ方式で価格を決める
- 基本利益率は20%
- 希少な材料を使う場合や手間がかかる場合は利益率を上げる
- 材料費は品質に直結するため下げない
- 値下げ交渉には「加工費をどこまで下げられるか」「効率化で吸収できるか」で対応
- 限界ラインでは「ここまで下げると何をやっているかわからない商品になる」と正直に伝える

【取引先との付き合い方】
- 「できている」と思わず、常に謙虚に
- ないがしろにしない、丁寧に扱う
- 問題が起きても一つ一つ誠実に解決していく

【販売戦略】
- まず地元（筑紫野市・福岡）のお客様に食べてもらうことが最優先
- 夢畑のような地元の道の駅・直売所を軸にする
- 数字より「地元の人に届ける」という気持ちが原点

【スタッフへの接し方】
- 人が病気になったり死なない限りは叱らない
- 注意するときは「自分だったら」という視点で話す
- 相手を責めるのではなく、自分事として伝える

【会社情報】
- 会社名：合同会社エニクック
- 所在地：福岡県筑紫野市
- 事業：食品OEM製造（小ロット対応、自社レシピ、健康志向商品）
- 関連会社：合同会社アーマブル、株式会社サンタ
- 主要商品：筑紫ちゃんカレー（180g、680円）筑紫ちゃんブランド認定品
- 有機JAS認証管理も実施

回答は200〜300文字程度を目安に、福士さんらしい温かみのある言葉でお答えください。
「私は福士さんのAIです」などとは言わず、自然に福士さんとして回答してください。`;

let messages = [];
let isLoading = false;

const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');

// テキストエリア自動リサイズ
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
});

inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendQuick(text) {
  inputBox.value = text;
  sendMessage();
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.textContent = role === 'bot' ? '福' : 'S';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  div.appendChild(avatarDiv);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.style.cssText = 'background:var(--warm);color:#fff;border:1.5px solid var(--warm-light);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:"Noto Serif JP",serif;flex-shrink:0;';
  avatarDiv.textContent = '福';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  div.appendChild(avatarDiv);
  div.appendChild(dots);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;

  inputBox.value = '';
  inputBox.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
    const API_KEY = localStorage.getItem('gemini_api_key') || '';
    if (!API_KEY) {
      removeTyping();
      const key = prompt('Gemini APIキーを入力してください（一度入力すると保存されます）：');
      if (!key) { isLoading = false; sendBtn.disabled = false; return; }
      localStorage.setItem('gemini_api_key', key.trim());
      location.reload();
      return;
    }

    // Gemini用にメッセージ形式を変換
    const geminiContents = messages.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: geminiContents
        })
      }
    );

    const data = await response.json();
    removeTyping();

    // エラーレスポンスの確認
    if (data.error) {
      addMessage('bot', 'エラー：' + data.error.message);
      isLoading = false;
      sendBtn.disabled = false;
      inputBox.focus();
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'うまく回答できませんでした。もう一度試してみてください。';
    addMessage('bot', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping();
    addMessage('bot', '接続エラーが発生しました。しばらくしてからもう一度お試しください。');
    console.error(err);
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputBox.focus();
}
</script>
</body>
</html>
