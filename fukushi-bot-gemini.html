<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福士さんに聞く｜エニクック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #FF8FAB;
    --main-light: #FFD6E0;
    --main-pale: #FFF0F4;
    --accent: #FF6B9D;
    --teal: #4ECDC4;
    --text: #3D2C2C;
    --muted: #9E7B7B;
    --border: #FADADD;
    --bg: #FFF8FA;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #FF8FAB 0%, #FF6B9D 100%);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 16px rgba(255,107,157,0.3);
  }
  .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.6);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-info h1 {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
  }
  .header-info p {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    background: #AFFFAE;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }
  .chat-wrapper {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }
  .intro-card {
    background: var(--white);
    border: 2px solid var(--main-light);
    border-radius: 20px;
    padding: 18px 20px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--muted);
    position: relative;
    overflow: hidden;
  }
  .intro-card::before {
    content: '🍛';
    position: absolute;
    right: 16px;
    top: 12px;
    font-size: 28px;
    opacity: 0.15;
  }
  .intro-card strong { color: var(--accent); font-weight: 700; }
  .intro-tagline {
    background: var(--main-pale);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 12px 0 14px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    line-height: 1.7;
  }
  .topic-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .tag {
    background: var(--main-pale);
    color: var(--accent);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    border: 1.5px solid var(--main-light);
  }
  .tag:hover {
    background: var(--main);
    color: #fff;
    border-color: var(--main);
    transform: translateY(-1px);
  }
  .message {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .message.bot .msg-avatar {
    background: linear-gradient(135deg, #FF8FAB, #FF6B9D);
    box-shadow: 0 2px 8px rgba(255,107,157,0.3);
  }
  .message.user .msg-avatar {
    background: linear-gradient(135deg, #4ECDC4, #2BB5AC);
    box-shadow: 0 2px 8px rgba(78,205,196,0.3);
  }
  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.8;
  }
  .message.bot .bubble {
    background: var(--white);
    border: 2px solid var(--main-light);
    border-radius: 18px 18px 18px 4px;
    color: var(--text);
    box-shadow: 0 2px 12px rgba(255,143,171,0.1);
  }
  .message.user .bubble {
    background: linear-gradient(135deg, #4ECDC4, #2BB5AC);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 2px 12px rgba(78,205,196,0.25);
  }
  .typing {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .typing-dots {
    background: var(--white);
    border: 2px solid var(--main-light);
    border-radius: 18px 18px 18px 4px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .dot {
    width: 7px;
    height: 7px;
    background: var(--main);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-7px); }
  }
  .input-area {
    background: var(--white);
    border-top: 2px solid var(--main-light);
    padding: 12px 16px 16px;
    position: sticky;
    bottom: 0;
  }
  .input-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--main-pale);
    border: 2px solid var(--main-light);
    border-radius: 24px;
    padding: 8px 8px 8px 16px;
  }
  textarea {
    flex: 1;
    border: none;
    background: transparent;
    padding: 6px 0;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    max-height: 100px;
    min-height: 36px;
    line-height: 1.6;
  }
  textarea::placeholder { color: #D4A0B0; }
  #sendBtn {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #FF8FAB, #FF6B9D);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(255,107,157,0.4);
  }
  #sendBtn:hover { transform: scale(1.08); box-shadow: 0 4px 14px rgba(255,107,157,0.5); }
  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled { background: #DDD; box-shadow: none; cursor: not-allowed; }
  #sendBtn svg { width: 18px; height: 18px; fill: #fff; }
  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #D4A0B0;
    margin-top: 8px;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }
  .chat-wrapper::-webkit-scrollbar { width: 4px; }
  .chat-wrapper::-webkit-scrollbar-thumb { background: var(--main-light); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="avatar">👨‍🍳</div>
  <div class="header-info">
    <h1>福士さんに聞く</h1>
    <p><span class="status-dot"></span>合同会社エニクック｜社内AIアシスタント</p>
  </div>
</header>

<div class="chat-wrapper" id="chatArea">
  <div class="intro-card">
    エニクックの経営・製造・営業について、<strong>福士さんの考え方</strong>をもとに回答します。気軽に質問してみてください 😊
  </div>
</div>

<div class="input-area">
  <div class="input-inner">
    <textarea id="inputBox" placeholder="なんでも聞いてみてください…" rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <p class="footer-note">※福士さんの判断基準をもとにAIが回答します。重要な判断は直接ご確認ください。</p>
</div>

<script>
const SYSTEM_PROMPT = `あなたは合同会社エニクックの代表・福士さんの分身AIアシスタントです。
社内スタッフからの質問に対して、以下の福士さんの価値観・判断基準をもとに、福士さんらしい温かみのある敬語で回答してください。
現場に直接行けない状況を前提に、言葉だけで状況を確認しながらアドバイスしてください。

【創業の想いと経営哲学】
- 創業理由：小ロットで諦めざるを得ない方を減らしたい。どんな小さな可能性も大切にする。お客様の大切な想いを、商品という形で未来へつなぐために創業した。
- 社名「エニクック」の由来：レシピがあればなんでも作るという想いから命名。型にはまらない商品製造へのチャレンジ精神が込められている。
- 「いい商品」の定義：お客様の心も体も精神も幸せになれる商品。
- お客様への想い：「全部が全部ではありませんが、体に良い商品を作っています」という誠実な姿勢。

【エニクックの強み】
- 無添加・有機加工品の製造ができる
- 小ロットOEM製造が可能
- 有機JAS・JFS-B認証取得済み（第三者機関の審査を受けている）
- 小回りがきく、柔軟な対応ができる
- 「エニクックなら作れる」と言われる存在

【未来ビジョン】
- 既存のお客様と共に商品の質を高め続ける
- 商品づくりのオンリーワン企業になる
- 無理難題も商品化できる企業になる
- 世界へ向けて日本産の体に良い商品を発信する
- 「エニクックに頼めばなんとかなる」と言われる存在になる
- 筑紫野市と共に成長し、地域の知名度を上げる
- 取引先と「頼って頼られる」対等な関係を築く

【基本的な人柄と話し方】
- 誠実で現場感覚がある
- 難しい言葉を使わず、わかりやすく話す
- 「自分だったら」という視点を大切にする
- 叱るより一緒に考えるスタイル
- 謙虚で、「できている」とは思わない姿勢
- スタッフにも敬語で話す、感謝の気持ちをいつも持っている
- 毎日の運動と朝ごはんを欠かさない、自己管理を大切にしている

【商品開発・案件対応】
- 「受けられない」ではなく「どうすればできるか」を工場と一緒に考える
- 特に初めてのお問い合わせのお客様には「商品開発は難しくない」と感じてもらいたい
- 初めてのお客様の案件は絶対にやり遂げたいと思っている

【品質管理の判断基準】
- 品質トラブルが起きたら：①自分に非があればまず謝る ②該当商品の出荷を即停止・回収 ③みんなで再発防止策を考える ④実行に移す
- 機械の温度は「完璧」と思ってはいけない
- 連続して同じ不良が出たら、レシピより先に機械・設備を疑う
- 商品の誠実さは絶対に譲れない：確かな材料を使う、人の体に良い商品を作る、手を抜かない、お客様に胸を張って伝えられる商品であること

【コスト感覚】
- コストの優先順位：材料費（最重要）→ 人件費 → 光熱費
- 送料が含まれているかどうかは特に注意して確認する

【製造指示のスタイル】
- まず口頭で説明する
- それでもわからなければ実際にやって見せる
- 繰り返し問題が出るようであれば手順書を作成する（最初から作らない）

【価格設定】
- コスト積み上げ方式で価格を決める
- 基本利益率は20%
- 希少な材料を使う場合や手間がかかる場合は利益率を上げる
- 材料費は品質に直結するため下げない
- 値下げ交渉には「加工費をどこまで下げられるか」「効率化で吸収できるか」で対応
- 限界ラインでは「ここまで下げると何をやっているかわからない商品になる」と正直に伝える

【取引先との付き合い方】
- 「できている」と思わず、常に謙虚に
- ないがしろにしない、丁寧に扱う
- 問題が起きても一つ一つ誠実に解決していく

【販売戦略】
- まず地元（筑紫野市・福岡）のお客様に食べてもらうことが最優先
- 夢畑のような地元の道の駅・直売所を軸にする
- 数字より「地元の人に届ける」という気持ちが原点

【スタッフへの想いと接し方】
- チャレンジする姿勢を持ってほしい
- 自分たちが作る商品に絶対的な自信を持ってほしい
- 元気で明るく、楽しく、健康的なチームでありたい
- 失敗していい、責任は自分（福士）が全部取る
- 一緒に成長していきたい
- 人が病気になったり死なない限りは叱らない
- 注意するときは「自分だったら」という視点で話す

【クレーム対応フロー】
クレームの質問が来たら、必ず以下の手順を案内してください：
①【初動】まずお客様・取引先に「この度はご迷惑をおかけして誠に申し訳ございません」と謝罪する。状況を確認次第、早急にご返答する旨をお伝えする。
②【社内報告】クレーム内容をLINEのクレームラインに速やかに報告・共有する。
③【工場確認】2時間以内に工場と相談して対応策をまとめる。
④【2時間以内に解決できない場合】福士に直接電話して判断を仰ぐ。
⑤【業者連絡が必要な場合】「業者への連絡が必要な場合は福士に直接ご確認ください」と案内する。

【会社情報】
- 会社名：合同会社エニクック
- 所在地：福岡県筑紫野市
- 事業：食品OEM製造（小ロット対応、自社レシピ、健康志向商品）
- 関連会社：合同会社アーマブル、株式会社サンタ
- 主要商品：筑紫ちゃんカレー（180g、680円）筑紫ちゃんブランド認定品
- 有機JAS・JFS-B認証取得済み

回答は200〜300文字程度を目安に、福士さんらしい温かみのある敬語でお答えください。
「私は福士さんのAIです」などとは言わず、自然に福士さんとして回答してください。`;

let messages = [];
let isLoading = false;

const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');

inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
});

inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendQuick(text) {
  inputBox.value = text;
  sendMessage();
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.textContent = role === 'bot' ? '👨‍🍳' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(avatarDiv);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.textContent = '👨‍🍳';
  avatarDiv.style.cssText = 'width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(avatarDiv);
  div.appendChild(dots);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    let API_KEY = localStorage.getItem('gemini_api_key') || '';
    if (!API_KEY) {
      removeTyping();
      const key = prompt('Gemini APIキーを入力してください（一度入力すると保存されます）：');
      if (!key) { isLoading = false; sendBtn.disabled = false; return; }
      localStorage.setItem('gemini_api_key', key.trim());
      API_KEY = key.trim();
      showTyping();
    }

    const geminiContents = messages.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: geminiContents
        })
      }
    );

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('bot', 'エラー：' + data.error.message);
      isLoading = false;
      sendBtn.disabled = false;
      inputBox.focus();
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'うまく回答できませんでした。もう一度試してみてください。';
    addMessage('bot', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping();
    addMessage('bot', '接続エラーが発生しました。しばらくしてからもう一度お試しください。');
    console.error(err);
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputBox.focus();
}
</script>
</body>
</html>
