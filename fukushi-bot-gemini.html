</div>

const SYSTEM_PROMPT_BASE = `あなたは合同会社エニクックの代表・福士さんの分身AIアシスタントです。

// 製造日報を取得する関数
async function fetchNippoData(targetDate) {
  try {
    const snapshot = await getDocs(collection(nippoDB, "nippo"));
    const reports = [];
    snapshot.forEach(d => {
      const data = d.data();
      if (!targetDate || data.date === targetDate) {
        reports.push(data);
      }
    });
    return reports;
  } catch(e) {
    console.error("製造日報取得エラー:", e);
    return [];
  }
}

// 今日の日付をYYYY-MM-DD形式で返す
function getTodayStr() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

// 製造日報データを読みやすいテキストに変換
function formatNippoForAI(reports) {
  if (reports.length === 0) return "本日の製造日報データはありません。";
  let text = "";
  reports.forEach(r => {
    text += `【製造日：${r.date}　担当：${r.author || "不明"}】
`;
    if (r.semiProduct) text += `半製品：${r.semiProduct}
`;
    ['batch1','batch2','batch3'].forEach((b,i) => {
      const batch = r[b];
      if (batch && batch.name) {
        text += `バッチ${i+1}：${batch.name}　数量：${batch.qty || "-"}袋　時間：${batch.start || "-"}〜${batch.end || "-"}
`;
        if (batch.notes) text += `　メモ：${batch.notes}
`;
      }
    });
    if (r.otherNotes) text += `備考：${r.otherNotes}
`;
    text += "
";
  });
  return text;
}

// 取引先情報を読み込む
async function loadClients() {
  try {
    const snapshot = await getDocs(collection(db, "clients"));
    clientsData = [];
    snapshot.forEach(d => clientsData.push({ id: d.id, ...d.data() }));
    renderClientList();
  } catch(e) { console.error(e); }
}

function renderClientList() {
  const list = document.getElementById('clientList');
  if (clientsData.length === 0) {
    list.innerHTML = '<p class="empty-msg">取引先を追加してください</p>';
    return;
  }
  list.innerHTML = clientsData.map(c => `
    <div class="client-card">
      <div class="client-card-header">
        <span class="client-name">🏢 ${c.name}</span>
        <div class="client-actions">
          <button class="edit-btn" onclick="editClient('${c.id}')">編集</button>
          <button class="del-btn" onclick="deleteClient('${c.id}')">削除</button>
        </div>
      </div>
      ${c.contact ? `<div class="client-label">👤 担当者</div><div class="client-memo">${c.contact}</div>` : ''}
      ${c.phone ? `<div class="client-label" style="margin-top:6px">📞 電話番号</div><div class="client-memo">${c.phone}</div>` : ''}
      ${c.memo ? `<div class="client-label" style="margin-top:8px">📝 対応メモ・注意事項</div><div class="client-memo">${c.memo}</div>` : ''}
    </div>
  `).join('');
}

window.saveClient = async function() {
  const name = document.getElementById('clientName').value.trim();
  const memo = document.getElementById('clientMemo').value.trim();
  const contact = document.getElementById('clientContact').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const editId = document.getElementById('editId').value;
  if (!name) { alert('会社名を入力してください'); return; }
  try {
    if (editId) {
      await updateDoc(doc(db, "clients", editId), { name, memo, contact, phone });
    } else {
      await addDoc(collection(db, "clients"), { name, memo, contact, phone, createdAt: new Date() });
    }
    document.getElementById('clientName').value = '';
    document.getElementById('clientMemo').value = '';
    document.getElementById('clientContact').value = '';
    document.getElementById('clientPhone').value = '';
    document.getElementById('editId').value = '';
    document.getElementById('formTitle').textContent = '➕ 取引先を追加';
    await loadClients();
  } catch(e) { alert('保存に失敗しました: ' + e.message); }
}

window.editClient = function(id) {
  const c = clientsData.find(x => x.id === id);
  if (!c) return;
  document.getElementById('clientName').value = c.name || '';
  document.getElementById('clientMemo').value = c.memo || '';
  document.getElementById('clientContact').value = c.contact || '';
  document.getElementById('clientPhone').value = c.phone || '';
  document.getElementById('editId').value = id;
  document.getElementById('formTitle').textContent = '✏️ 取引先を編集';
  window.scrollTo(0, 0);
}

window.deleteClient = async function(id) {
  if (!confirm('この取引先を削除しますか？')) return;
  try {
    await deleteDoc(doc(db, "clients", id));
    await loadClients();
  } catch(e) { alert('削除に失敗しました'); }
}

// PIN管理
window.openAdmin = function() {
  if (document.getElementById('tabBar').classList.contains('visible')) {
    closeAdmin();
  } else {
    document.getElementById('pinOverlay').classList.add('visible');
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    setTimeout(() => document.getElementById('pinInput').focus(), 100);
  }
}

window.checkPin = function() {
  const pin = document.getElementById('pinInput').value;
  if (pin === ADMIN_PIN) {
    document.getElementById('pinOverlay').classList.remove('visible');
    document.getElementById('tabBar').classList.add('visible');
    switchTab('admin');
    loadClients();
  } else {
    document.getElementById('pinError').textContent = 'PINコードが違います';
  }
}

function closeAdmin() {
  document.getElementById('tabBar').classList.remove('visible');
  switchTab('chat');
}

window.switchTab = function(tab) {
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
  document.getElementById('chatScreen').style.display = tab === 'chat' ? 'flex' : 'none';
  const adminEl = document.getElementById('adminScreen');
  adminEl.style.display = tab === 'admin' ? 'flex' : 'none';
  if (tab === 'admin') adminEl.classList.add('visible');
}

document.getElementById('pinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.checkPin();
});

    av.style.cssText = 'overflow:hidden;';
    const img = document.createElement('img');
    img.src = 'icon.png';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
    av.appendChild(img);
  } else {
    av.textContent = '👤';
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.style.cssText = 'width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);overflow:hidden;';
  const typingImg = document.createElement('img');
  typingImg.src = 'icon.png';
  typingImg.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
  av.appendChild(typingImg);
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(av); div.appendChild(dots);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

window.sendMessage = async function() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;
  inputBox.value = ''; inputBox.style.height = 'auto';
  isLoading = true; sendBtn.disabled = true;
  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    let API_KEY = localStorage.getItem('gemini_api_key') || '';
    if (!API_KEY) {
      removeTyping();
      const key = prompt('Gemini APIキーを入力してください（一度入力すると保存されます）：');
      if (!key) { isLoading = false; sendBtn.disabled = false; return; }
      localStorage.setItem('gemini_api_key', key.trim());
      API_KEY = key.trim();
      showTyping();
    }

    // 取引先情報をシステムプロンプトに追加
    let systemPrompt = SYSTEM_PROMPT_BASE;
    if (clientsData.length > 0) {
      systemPrompt += '\n\n【取引先情報】\n以下の取引先情報を参考に回答してください：\n';
      clientsData.forEach(c => {
        systemPrompt += `\n■ ${c.name}\n`;
        if (c.contact) systemPrompt += `  担当者：${c.contact}\n`;
        if (c.phone) systemPrompt += `  電話番号：${c.phone}\n`;
        if (c.memo) systemPrompt += `  対応メモ・注意事項：${c.memo}\n`;
      });
    }

    // 製造日報に関する質問かチェック
    const nippoKeywords = ['製造', '日報', '今日', '本日', 'バッチ', '作業', '担当', '数量', '何袋', '何を作', 'とりめし', 'カレー', '生産'];
    const isNippoQuery = nippoKeywords.some(k => text.includes(k));
    if (isNippoQuery) {
      const today = getTodayStr();
      const nippoReports = await fetchNippoData(today);
      const nippoText = formatNippoForAI(nippoReports);
      systemPrompt += `\n\n【本日の製造日報（${today}）】\n${nippoText}`;
    }

    const geminiContents = messages.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: geminiContents
        })
      }
    );

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('bot', 'エラー：' + data.error.message);
      isLoading = false; sendBtn.disabled = false; inputBox.focus();
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'うまく回答できませんでした。もう一度試してみてください。';
    addMessage('bot', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch(err) {
    removeTyping();
    addMessage('bot', '接続エラーが発生しました。しばらくしてからもう一度お試しください。');
    console.error(err);
  }
  isLoading = false; sendBtn.disabled = false; inputBox.focus();
}

// CSVエクスポート
window.exportCSV = function() {
  if (clientsData.length === 0) { alert('エクスポートするデータがありません'); return; }
  const header = ['会社名', '担当者名', '電話番号', '対応メモ・注意事項'];
  const rows = clientsData.map(c => [
    c.name || '',
    c.contact || '',
    c.phone || '',
    c.memo || ''
  ].map(v => '"' + v.replace(/"/g, '""').replace(/\n/g, ' ') + '"'));
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '取引先リスト.csv'; a.click();
  URL.revokeObjectURL(url);
}

// CSVインポート
window.importCSV = async function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) { alert('データが見つかりませんでした'); return; }
  
  // ヘッダー行をスキップ
  const dataLines = lines.slice(1);
  let count = 0;
  for (const line of dataLines) {
    // CSV解析（ダブルクォート対応）
    const cols = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (line[i] === ',' && !inQuote) {
        cols.push(cur); cur = '';
      } else { cur += line[i]; }
    }
    cols.push(cur);
    const name = (cols[0] || '').trim();
    const contact = (cols[1] || '').trim();
    const phone = (cols[2] || '').trim();
    const memo = (cols[3] || '').trim();
    if (!name) continue;
    try {
      await addDoc(collection(db, "clients"), { name, contact, phone, memo, createdAt: new Date() });
      count++;
    } catch(e) { console.error(e); }
  }
  alert(count + '件のデータをインポートしました');
  event.target.value = '';
  await loadClients();
}

// 初期読み込み
loadClients();
