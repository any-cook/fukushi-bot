<style>
  :root {
    --main: #FF8FAB;
    --main-light: #FFD6E0;
    --main-pale: #FFF0F4;
    --accent: #FF6B9D;
    --teal: #4ECDC4;
    --text: #3D2C2C;
    --muted: #9E7B7B;
    --border: #FADADD;
    --bg: #FFF8FA;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #FF8FAB 0%, #FF6B9D 100%);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 16px rgba(255,107,157,0.3);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {

  .admin-btn {
    background: rgba(255,255,255,0.2);
    border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    transition: background 0.2s;
  }
  .admin-btn:hover { background: rgba(255,255,255,0.35); }

  .tab-bar {
    display: none;
    background: var(--white);
    border-bottom: 2px solid var(--main-light);
    padding: 0 20px;
  }

    padding: 12px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);

    margin-bottom: -2px;
    transition: all 0.2s;
  }

  #chatScreen { display: flex; flex-direction: column; flex: 1; }

    flex: 1; overflow-y: auto; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;

  .intro-card {
    background: var(--white); border: 2px solid var(--main-light);
    border-radius: 20px; padding: 18px 20px; font-size: 13px;
    line-height: 1.9; color: var(--muted); position: relative; overflow: hidden;

  .intro-card::before { content: '🍛'; position: absolute; right: 16px; top: 12px; font-size: 28px; opacity: 0.15; }
  .intro-card strong { color: var(--accent); font-weight: 700; }
  .message { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .message.user { flex-direction: row-reverse; }
  .msg-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .message.bot .msg-avatar { background: linear-gradient(135deg,#FF8FAB,#FF6B9D); }
  .message.user .msg-avatar { background: linear-gradient(135deg,#4ECDC4,#2BB5AC); }
  .bubble { max-width: 72%; padding: 12px 16px; font-size: 14px; line-height: 1.8; }
  .message.bot .bubble { background: var(--white); border: 2px solid var(--main-light); border-radius: 18px 18px 18px 4px; color: var(--text); }
  .message.user .bubble { background: linear-gradient(135deg,#4ECDC4,#2BB5AC); color: #fff; border-radius: 18px 18px 4px 18px; }
  .typing { display: flex; gap: 10px; align-items: flex-end; }
  .typing-dots { background: var(--white); border: 2px solid var(--main-light); border-radius: 18px 18px 18px 4px; padding: 14px 18px; display: flex; gap: 5px; align-items: center; }
  .dot { width: 7px; height: 7px; background: var(--main); border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2){animation-delay:0.2s} .dot:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  .input-area { background: var(--white); border-top: 2px solid var(--main-light); padding: 12px 16px 16px; position: sticky; bottom: 0; }
  .input-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--main-pale); border: 2px solid var(--main-light); border-radius: 24px; padding: 8px 8px 8px 16px; }
  textarea { flex: 1; border: none; background: transparent; padding: 6px 0; font-family: 'Noto Sans JP',sans-serif; font-size: 14px; color: var(--text); resize: none; outline: none; max-height: 100px; min-height: 36px; line-height: 1.6; }
  textarea::placeholder { color: #D4A0B0; }
  #sendBtn { width: 40px; height: 40px; background: linear-gradient(135deg,#FF8FAB,#FF6B9D); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; flex-shrink: 0; box-shadow: 0 2px 8px rgba(255,107,157,0.4); }
  #sendBtn:hover { transform: scale(1.08); }
  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled { background: #DDD; box-shadow: none; cursor: not-allowed; }
  #sendBtn svg { width: 18px; height: 18px; fill: #fff; }
  .footer-note { text-align: center; font-size: 10px; color: #D4A0B0; margin-top: 8px; max-width: 680px; margin-left: auto; margin-right: auto; }

  /* 管理画面 */
  #adminScreen { display: none; flex: 1; flex-direction: column; }
  #adminScreen.visible { display: flex; }
  .admin-panel { max-width: 680px; width: 100%; margin: 0 auto; padding: 20px 16px; flex: 1; }
  .admin-panel h2 { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .client-form { background: var(--white); border: 2px solid var(--main-light); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  .client-form h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .form-group input, .form-group textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-family: 'Noto Sans JP',sans-serif; font-size: 13px;
    color: var(--text); background: var(--main-pale); outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--main); background: #fff; }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .save-btn {
    width: 100%; background: linear-gradient(135deg,#FF8FAB,#FF6B9D);
    border: none; border-radius: 12px; padding: 12px;
    color: #fff; font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans JP',sans-serif; cursor: pointer;
    transition: opacity 0.2s;
  }
  .save-btn:hover { opacity: 0.85; }
  .client-list { display: flex; flex-direction: column; gap: 12px; }
  .client-card {
    background: var(--white); border: 2px solid var(--main-light);

  .client-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .client-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .client-actions { display: flex; gap: 8px; }
  .edit-btn, .del-btn { border: none; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-family: 'Noto Sans JP',sans-serif; cursor: pointer; font-weight: 500; }
  .edit-btn { background: var(--main-pale); color: var(--accent); border: 1.5px solid var(--main-light); }
  .del-btn { background: #FFF0F0; color: #E05555; border: 1.5px solid #FFCECE; }
  .client-memo { font-size: 12px; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }
  .client-label { font-size: 11px; font-weight: 500; color: var(--main); margin-bottom: 2px; }
  .empty-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }
  .csv-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .csv-btn { flex: 1; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; font-family: "Noto Sans JP",sans-serif; cursor: pointer; border: 2px solid; transition: opacity 0.2s; }
  .csv-btn:hover { opacity: 0.8; }
  .csv-export { background: var(--teal-light, #C8F4F2); color: #2BB5AC; border-color: #4ECDC4; }
  .csv-import { background: var(--main-pale); color: var(--accent); border-color: var(--main-light); }

  .pin-dialog { background: #fff; border-radius: 20px; padding: 28px 24px; width: 300px; text-align: center; }
  .pin-dialog h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .pin-dialog p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .pin-input { width: 100%; border: 2px solid var(--main-light); border-radius: 10px; padding: 10px; font-size: 18px; text-align: center; letter-spacing: 6px; outline: none; font-family: monospace; }
  .pin-input:focus { border-color: var(--main); }
  .pin-btn { margin-top: 12px; width: 100%; background: linear-gradient(135deg,#FF8FAB,#FF6B9D); border: none; border-radius: 10px; padding: 10px; color: #fff; font-size: 14px; font-weight: 700; font-family: 'Noto Sans JP',sans-serif; cursor: pointer; }
  .pin-error { color: #E05555; font-size: 12px; margin-top: 8px; }

  .chat-wrapper::-webkit-scrollbar { width: 4px; }
  .chat-wrapper::-webkit-scrollbar-thumb { background: var(--main-light); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar"><img src="icon.png" alt="福士さん"></div>
    <div class="header-info">
      <h1>福士さんに聞く</h1>
      <p><span class="status-dot"></span>合同会社エニクック｜社内AIアシスタント</p>
    </div>
  </div>
  <button class="admin-btn" onclick="openAdmin()">⚙ 管理</button>
</header>

<div class="tab-bar" id="tabBar">
  <div class="tab active" id="tabChat" onclick="switchTab('chat')">💬 チャット</div>
  <div class="tab" id="tabAdmin" onclick="switchTab('admin')">🏢 取引先管理</div>
</div>

<!-- チャット画面 -->
<div id="chatScreen">
  <div class="chat-wrapper" id="chatArea">
    <div class="intro-card">
      エニクックの経営・製造・営業について、<strong>福士さんの考え方</strong>をもとに回答します。気軽に質問してみてください 😊
    </div>
  </div>
  <div class="input-area">
    <div class="input-inner">
      <textarea id="inputBox" placeholder="なんでも聞いてみてください…" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="footer-note">※福士さんの判断基準をもとにAIが回答します。重要な判断は直接ご確認ください。</p>
  </div>
</div>

<!-- 管理画面 -->
<div id="adminScreen">
  <div class="admin-panel">
    <h2>🏢 取引先管理</h2>
    <div class="client-form">
      <h3 id="formTitle">➕ 取引先を追加</h3>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>会社名</label>
        <input type="text" id="clientName" placeholder="例：株式会社〇〇">
      </div>
      <div class="form-group">
        <label>対応メモ・注意事項</label>
        <textarea id="clientMemo" placeholder="例：担当者は田中様。納期は必ず2週間前に確認すること。アレルギー対応品の製造実績あり。"></textarea>
      </div>
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="clientContact" placeholder="例：田中様">
      </div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="text" id="clientPhone" placeholder="例：090-XXXX-XXXX">
      </div>
      <button class="save-btn" onclick="saveClient()">💾 保存する</button>
    </div>
    <div class="csv-bar">
      <button class="csv-btn csv-export" onclick="exportCSV()">📥 CSVエクスポート</button>
      <label class="csv-btn csv-import" style="text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        📤 CSVインポート
        <input type="file" id="csvFileInput" accept=".csv" onchange="importCSV(event)">
      </label>
    </div>
    <div class="client-list" id="clientList">
      <p class="empty-msg">取引先を追加してください</p>
    </div>
  </div>
</div>

<!-- PINダイアログ -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-dialog">
    <h3>🔐 管理画面</h3>
    <p>PINコードを入力してください</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="••••">
    <div class="pin-error" id="pinError"></div>
    <button class="pin-btn" onclick="checkPin()">入力</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCL7dn76AlywG98sgDZ5b5jZfTWyHp7FE",
  authDomain: "fukushi-bot.firebaseapp.com",
  projectId: "fukushi-bot",
  storageBucket: "fukushi-bot.firebasestorage.app",
  messagingSenderId: "1022545354265",
  appId: "1:1022545354265:web:41e7d5fc32dbeea5ba1488"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PIN = "1234";
let clientsData = [];
let messages = [];
let isLoading = false;

const SYSTEM_PROMPT_BASE = `あなたは合同会社エニクックの代表・福士さんの分身AIアシスタントです。
社内スタッフからの質問に対して、以下の福士さんの価値観・判断基準をもとに、福士さんらしい温かみのある敬語で回答してください。
現場に直接行けない状況を前提に、言葉だけで状況を確認しながらアドバイスしてください。

【創業の想いと経営哲学】
- 創業理由：小ロットで諦めざるを得ない方を減らしたい。どんな小さな可能性も大切にする。お客様の大切な想いを、商品という形で未来へつなぐために創業した。
- 社名「エニクック」の由来：レシピがあればなんでも作るという想いから命名。型にはまらない商品製造へのチャレンジ精神が込められている。
- 「いい商品」の定義：お客様の心も体も精神も幸せになれる商品。
- お客様への想い：「全部が全部ではありませんが、体に良い商品を作っています」という誠実な姿勢。

【エニクックの強み】
- 無添加・有機加工品の製造ができる
- 小ロットOEM製造が可能
- 有機JAS・JFS-B認証取得済み
- 小回りがきく、柔軟な対応ができる

【未来ビジョン】
- 商品づくりのオンリーワン企業になる
- 世界へ向けて日本産の体に良い商品を発信する
- 「エニクックに頼めばなんとかなる」と言われる存在になる
- 筑紫野市と共に成長し、地域の知名度を上げる
- 取引先と「頼って頼られる」対等な関係を築く

【基本的な人柄と話し方】
- 誠実で現場感覚がある
- 難しい言葉を使わず、わかりやすく話す
- 「自分だったら」という視点を大切にする
- 叱るより一緒に考えるスタイル
- 謙虚で、「できている」とは思わない姿勢
- スタッフにも敬語で話す、感謝の気持ちをいつも持っている

【商品開発・案件対応】
- 「受けられない」ではなく「どうすればできるか」を工場と一緒に考える
- 初めてのお客様の案件は絶対にやり遂げたいと思っている

【品質管理の判断基準】
- 品質トラブルが起きたら：①自分に非があればまず謝る ②該当商品の出荷を即停止・回収 ③みんなで再発防止策を考える ④実行に移す
- 機械の温度は「完璧」と思ってはいけない

- 商品の誠実さは絶対に譲れない

【コスト感覚】
- コストの優先順位：材料費（最重要）→ 人件費 → 光熱費
- 送料が含まれているかどうかは特に注意して確認する

【製造指示のスタイル】
- まず口頭で説明する
- それでもわからなければ実際にやって見せる
- 繰り返し問題が出るようであれば手順書を作成する

- まず地元（筑紫野市・福岡）のお客様に食べてもらうことが最優先
- 数字より「地元の人に届ける」という気持ちが原点

【スタッフへの想いと接し方】
- チャレンジする姿勢を持ってほしい
- 自分たちが作る商品に絶対的な自信を持ってほしい

【クレーム対応フロー】
①【初動】まずお客様・取引先に謝罪する。状況を確認次第、早急にご返答する旨をお伝えする。
②【社内報告】クレーム内容をLINEのクレームラインに速やかに報告・共有する。
③【工場確認】2時間以内に工場と相談して対応策をまとめる。
④【2時間以内に解決できない場合】福士に直接電話して判断を仰ぐ。
⑤【業者連絡が必要な場合】「業者への連絡が必要な場合は福士に直接ご確認ください」と案内する。

【会社情報】
- 会社名：合同会社エニクック / 所在地：福岡県筑紫野市
- 事業：食品OEM製造（小ロット対応、自社レシピ、健康志向商品）
- 関連会社：合同会社アーマブル、株式会社サンタ
- 主要商品：筑紫ちゃんカレー（180g、680円）筑紫ちゃんブランド認定品
- 有機JAS・JFS-B認証取得済み

回答は200〜300文字程度を目安に、福士さんらしい温かみのある敬語でお答えください。
「私は福士さんのAIです」などとは言わず、自然に福士さんとして回答してください。`;

// 取引先情報を読み込む
async function loadClients() {
  try {
    const snapshot = await getDocs(collection(db, "clients"));
    clientsData = [];
    snapshot.forEach(d => clientsData.push({ id: d.id, ...d.data() }));
    renderClientList();
  } catch(e) { console.error(e); }
}

function renderClientList() {
  const list = document.getElementById('clientList');
  if (clientsData.length === 0) {
    list.innerHTML = '<p class="empty-msg">取引先を追加してください</p>';
    return;
  }
  list.innerHTML = clientsData.map(c => `
    <div class="client-card">
      <div class="client-card-header">
        <span class="client-name">🏢 ${c.name}</span>
        <div class="client-actions">
          <button class="edit-btn" onclick="editClient('${c.id}')">編集</button>
          <button class="del-btn" onclick="deleteClient('${c.id}')">削除</button>
        </div>
      </div>
      ${c.contact ? `<div class="client-label">👤 担当者</div><div class="client-memo">${c.contact}</div>` : ''}
      ${c.phone ? `<div class="client-label" style="margin-top:6px">📞 電話番号</div><div class="client-memo">${c.phone}</div>` : ''}
      ${c.memo ? `<div class="client-label" style="margin-top:8px">📝 対応メモ・注意事項</div><div class="client-memo">${c.memo}</div>` : ''}
    </div>
  `).join('');
}

window.saveClient = async function() {
  const name = document.getElementById('clientName').value.trim();
  const memo = document.getElementById('clientMemo').value.trim();
  const contact = document.getElementById('clientContact').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const editId = document.getElementById('editId').value;
  if (!name) { alert('会社名を入力してください'); return; }
  try {
    if (editId) {
      await updateDoc(doc(db, "clients", editId), { name, memo, contact, phone });
    } else {
      await addDoc(collection(db, "clients"), { name, memo, contact, phone, createdAt: new Date() });
    }
    document.getElementById('clientName').value = '';
    document.getElementById('clientMemo').value = '';
    document.getElementById('clientContact').value = '';
    document.getElementById('clientPhone').value = '';
    document.getElementById('editId').value = '';
    document.getElementById('formTitle').textContent = '➕ 取引先を追加';
    await loadClients();
  } catch(e) { alert('保存に失敗しました: ' + e.message); }
}

window.editClient = function(id) {
  const c = clientsData.find(x => x.id === id);
  if (!c) return;
  document.getElementById('clientName').value = c.name || '';
  document.getElementById('clientMemo').value = c.memo || '';
  document.getElementById('clientContact').value = c.contact || '';
  document.getElementById('clientPhone').value = c.phone || '';
  document.getElementById('editId').value = id;
  document.getElementById('formTitle').textContent = '✏️ 取引先を編集';
  window.scrollTo(0, 0);
}

window.deleteClient = async function(id) {
  if (!confirm('この取引先を削除しますか？')) return;
  try {
    await deleteDoc(doc(db, "clients", id));
    await loadClients();
  } catch(e) { alert('削除に失敗しました'); }
}

// PIN管理
window.openAdmin = function() {
  if (document.getElementById('tabBar').classList.contains('visible')) {
    closeAdmin();
  } else {
    document.getElementById('pinOverlay').classList.add('visible');
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    setTimeout(() => document.getElementById('pinInput').focus(), 100);
  }
}

window.checkPin = function() {
  const pin = document.getElementById('pinInput').value;
  if (pin === ADMIN_PIN) {
    document.getElementById('pinOverlay').classList.remove('visible');
    document.getElementById('tabBar').classList.add('visible');
    switchTab('admin');
    loadClients();
  } else {
    document.getElementById('pinError').textContent = 'PINコードが違います';
  }
}

function closeAdmin() {
  document.getElementById('tabBar').classList.remove('visible');
  switchTab('chat');
}

window.switchTab = function(tab) {
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
  document.getElementById('chatScreen').style.display = tab === 'chat' ? 'flex' : 'none';
  const adminEl = document.getElementById('adminScreen');
  adminEl.style.display = tab === 'admin' ? 'flex' : 'none';
  if (tab === 'admin') adminEl.classList.add('visible');
}

document.getElementById('pinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.checkPin();
});

// チャット機能
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');

inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
});
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'bot' ? '👨‍🍳' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.style.cssText = 'width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,#FF8FAB,#FF6B9D);overflow:hidden;';
  const typingImg = document.createElement('img');
  typingImg.src = 'icon.png';
  typingImg.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
  av.appendChild(typingImg);
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(av); div.appendChild(dots);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

window.sendMessage = async function() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;
  inputBox.value = ''; inputBox.style.height = 'auto';
  isLoading = true; sendBtn.disabled = true;
  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    let API_KEY = localStorage.getItem('gemini_api_key') || '';
    if (!API_KEY) {
      removeTyping();
      const key = prompt('Gemini APIキーを入力してください（一度入力すると保存されます）：');
      if (!key) { isLoading = false; sendBtn.disabled = false; return; }
      localStorage.setItem('gemini_api_key', key.trim());
      API_KEY = key.trim();
      showTyping();
    }

    // 取引先情報をシステムプロンプトに追加
    let systemPrompt = SYSTEM_PROMPT_BASE;
    if (clientsData.length > 0) {
      systemPrompt += '\n\n【取引先情報】\n以下の取引先情報を参考に回答してください：\n';
      clientsData.forEach(c => {
        systemPrompt += `\n■ ${c.name}\n`;
        if (c.contact) systemPrompt += `  担当者：${c.contact}\n`;
        if (c.phone) systemPrompt += `  電話番号：${c.phone}\n`;
        if (c.memo) systemPrompt += `  対応メモ・注意事項：${c.memo}\n`;
      });
    }

    const geminiContents = messages.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: geminiContents
        })
      }
    );

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('bot', 'エラー：' + data.error.message);
      isLoading = false; sendBtn.disabled = false; inputBox.focus();
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'うまく回答できませんでした。もう一度試してみてください。';
    addMessage('bot', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch(err) {
    removeTyping();
    addMessage('bot', '接続エラーが発生しました。しばらくしてからもう一度お試しください。');
    console.error(err);
  }
  isLoading = false; sendBtn.disabled = false; inputBox.focus();
}

// CSVエクスポート
window.exportCSV = function() {
  if (clientsData.length === 0) { alert('エクスポートするデータがありません'); return; }
  const header = ['会社名', '担当者名', '電話番号', '対応メモ・注意事項'];
  const rows = clientsData.map(c => [
    c.name || '',
    c.contact || '',
    c.phone || '',
    c.memo || ''
  ].map(v => '"' + v.replace(/"/g, '""').replace(/\n/g, ' ') + '"'));
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '取引先リスト.csv'; a.click();
  URL.revokeObjectURL(url);
}

// CSVインポート
window.importCSV = async function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) { alert('データが見つかりませんでした'); return; }
  
  // ヘッダー行をスキップ
  const dataLines = lines.slice(1);
  let count = 0;
  for (const line of dataLines) {
    // CSV解析（ダブルクォート対応）
    const cols = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (line[i] === ',' && !inQuote) {
        cols.push(cur); cur = '';
      } else { cur += line[i]; }
    }
    cols.push(cur);
    const name = (cols[0] || '').trim();
    const contact = (cols[1] || '').trim();
    const phone = (cols[2] || '').trim();
    const memo = (cols[3] || '').trim();
    if (!name) continue;
    try {
      await addDoc(collection(db, "clients"), { name, contact, phone, memo, createdAt: new Date() });
      count++;
    } catch(e) { console.error(e); }
  }
  alert(count + '件のデータをインポートしました');
  event.target.value = '';
  await loadClients();
}

// 初期読み込み
loadClients();
</script>
